<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('My Cart')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-cart3 me-2"></i>Shopping Cart</h2>

    <div th:if="${cart.items.isEmpty()}" class="text-center py-5">
        <i class="bi bi-cart-x display-1 text-muted"></i>
        <h4 class="mt-3 text-muted">Your cart is empty</h4>
        <a th:href="@{/products}" class="btn btn-dark mt-3 px-5">Start Shopping</a>
    </div>

    <div class="row g-4" th:unless="${cart.items.isEmpty()}">

        <!-- Cart Items -->
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-0">
                    <div th:each="item, stat : ${cart.items}" class="p-4 border-bottom">
                        <div class="row align-items-center g-3">
                            <div class="col-3 col-md-2">
                                <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : 'https://placehold.co/100x100?text=Watch'}"
                                     class="img-fluid rounded" style="height:80px; object-fit:cover;"
                                     th:alt="${item.product.name}"/>
                            </div>
                            <div class="col-9 col-md-4">
                                <small class="text-muted text-uppercase fw-semibold" th:text="${item.product.brand}"></small>
                                <h6 class="fw-bold mb-0" th:text="${item.product.name}"></h6>
                                <small class="text-muted" th:text="'₹' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')} + ' each'"></small>
                            </div>
                            <div class="col-6 col-md-3">
                                <form th:action="@{/cart/update/{id}(id=${item.id})}" method="post" class="d-flex align-items-center gap-1">
                                    <button type="button" class="btn btn-outline-secondary btn-sm"
                                            onclick="this.nextElementSibling.stepDown(); this.form.submit()">−</button>
                                    <input type="number" name="quantity" th:value="${item.quantity}"
                                           min="1" max="99" class="form-control form-control-sm text-center" style="width:55px;"/>
                                    <button type="button" class="btn btn-outline-secondary btn-sm"
                                            onclick="this.previousElementSibling.stepUp(); this.form.submit()">+</button>
                                </form>
                            </div>
                            <div class="col-4 col-md-2 text-end">
                                <span class="fw-bold"
                                      th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',2,'POINT')}"></span>
                            </div>
                            <div class="col-2 col-md-1 text-end">
                                <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post">
                                    <button type="submit" class="btn btn-link text-danger p-0">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Order Summary -->
        <div class="col-lg-4">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Order Summary</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Items (<span th:text="${cart.totalItems}"></span>)</span>
                        <span th:text="'₹' + ${#numbers.formatDecimal(cart.totalPrice,1,'COMMA',2,'POINT')}"></span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Shipping</span>
                        <span class="text-success" th:text="${cart.totalPrice.compareTo(T(java.math.BigDecimal).valueOf(5000)) >= 0 ? 'FREE' : '₹199'}">₹199</span>
                    </div>
                    <hr/>
                    <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                        <span>Total</span>
                        <span th:text="'₹' + ${#numbers.formatDecimal(cart.totalPrice,1,'COMMA',2,'POINT')}"></span>
                    </div>
                    <a th:href="@{/orders/checkout}" class="btn btn-dark w-100 py-2 fw-semibold">
                        <i class="bi bi-lock me-2"></i>Proceed to Checkout
                    </a>
                    <a th:href="@{/products}" class="btn btn-outline-dark w-100 mt-2">Continue Shopping</a>
                </div>
            </div>
        </div>

    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
