<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Login')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height:80vh;">
    <div class="card shadow-lg border-0" style="width:100%;max-width:440px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <i class="bi bi-watch fs-1 text-warning"></i>
                <h3 class="fw-bold mt-2">Welcome Back</h3>
                <p class="text-muted small">Sign in to your WatchCart account</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger py-2">
                <i class="bi bi-exclamation-circle me-2"></i>Invalid email or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success py-2">
                <i class="bi bi-check-circle me-2"></i>You have been logged out.
            </div>
            <div th:if="${successMessage}" class="alert alert-success py-2">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="username" class="form-control" placeholder="you@example.com" required autofocus/>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
                    </div>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-center text-muted small mb-0">
                Don't have an account?
                <a th:href="@{/register}" class="fw-semibold text-dark">Create one free</a>
            </p>
        </div>
    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
