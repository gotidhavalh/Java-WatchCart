<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/layout :: head(${product.name})"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/}" class="text-dark">Home</a></li>
            <li class="breadcrumb-item"><a th:href="@{/products}" class="text-dark">Watches</a></li>
            <li class="breadcrumb-item active" th:text="${product.name}"></li>
        </ol>
    </nav>

    <div class="row g-5">
        <!-- Product Image -->
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm overflow-hidden" style="border-radius:16px;">
                <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/600x500?text=Watch'}"
                     class="img-fluid w-100" style="max-height:480px; object-fit:cover;"
                     th:alt="${product.name}"/>
            </div>
        </div>

        <!-- Product Info -->
        <div class="col-lg-7">
            <span class="badge bg-secondary text-uppercase mb-2" th:text="${product.brand}"></span>
            <h2 class="fw-bold mb-1" th:text="${product.name}">Watch Name</h2>
            <div class="text-warning mb-3">
                <i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i><i class="bi bi-star-fill"></i>
                <i class="bi bi-star-fill"></i><i class="bi bi-star-half"></i>
                <span class="text-muted small ms-1">(4.5 / 5)</span>
            </div>

            <h3 class="fw-bold text-dark mb-4"
                th:text="'₹' + ${#numbers.formatDecimal(product.price,1,'COMMA',2,'POINT')}">₹0</h3>

            <p class="text-muted" th:text="${product.description}">Description</p>

            <!-- Specs -->
            <div class="row g-2 my-4">
                <div class="col-6">
                    <div class="bg-white rounded p-3 border">
                        <small class="text-muted d-block">Movement</small>
                        <strong th:text="${product.movementType}">—</strong>
                    </div>
                </div>
                <div class="col-6">
                    <div class="bg-white rounded p-3 border">
                        <small class="text-muted d-block">Case Material</small>
                        <strong th:text="${product.caseMaterial ?: '—'}">—</strong>
                    </div>
                </div>
                <div class="col-6">
                    <div class="bg-white rounded p-3 border">
                        <small class="text-muted d-block">Strap</small>
                        <strong th:text="${product.strapMaterial ?: '—'}">—</strong>
                    </div>
                </div>
                <div class="col-6">
                    <div class="bg-white rounded p-3 border">
                        <small class="text-muted d-block">Water Resistance</small>
                        <strong th:text="${product.waterResistance ?: '—'}">—</strong>
                    </div>
                </div>
            </div>

            <!-- Stock badge -->
            <div class="mb-3">
                <span th:if="${product.stockQuantity > 0}" class="badge bg-success fs-6">
                    <i class="bi bi-check-circle me-1"></i>In Stock
                </span>
                <span th:unless="${product.stockQuantity > 0}" class="badge bg-danger fs-6">
                    <i class="bi bi-x-circle me-1"></i>Out of Stock
                </span>
            </div>

            <!-- Add to Cart -->
            <div sec:authorize="isAuthenticated()">
                <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center gap-3"
                      th:if="${product.stockQuantity > 0}">
                    <input type="hidden" name="productId" th:value="${product.id}"/>
                    <div class="input-group" style="width:130px;">
                        <button type="button" class="btn btn-outline-secondary" onclick="adjustQty(-1)">-</button>
                        <input type="number" id="qty" name="quantity" value="1" min="1"
                               th:max="${product.stockQuantity}" class="form-control text-center"/>
                        <button type="button" class="btn btn-outline-secondary" onclick="adjustQty(1)">+</button>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg px-4 fw-semibold flex-grow-1">
                        <i class="bi bi-cart-plus me-2"></i>Add to Cart
                    </button>
                </form>
            </div>
            <div sec:authorize="isAnonymous()" class="d-flex gap-3">
                <a th:href="@{/login}" class="btn btn-dark btn-lg px-5 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Login to Buy
                </a>
            </div>

            <div th:if="${successMessage}" class="alert alert-success mt-3 py-2">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
            </div>
        </div>
    </div>

    <!-- Related Products -->
    <div class="mt-5" th:if="${relatedProducts != null and !#lists.isEmpty(relatedProducts)}">
        <h4 class="fw-bold mb-4">You May Also Like</h4>
        <div class="row g-4">
            <div class="col-sm-6 col-lg-3" th:each="rp : ${relatedProducts}" th:if="${rp.id != product.id}">
                <div class="card border-0 shadow-sm h-100 product-card">
                    <img th:src="${rp.imageUrl != null ? rp.imageUrl : 'https://placehold.co/400x300?text=Watch'}"
                         class="card-img-top" style="height:180px; object-fit:cover;" th:alt="${rp.name}"/>
                    <div class="card-body">
                        <small class="text-muted text-uppercase" th:text="${rp.brand}"></small>
                        <h6 class="fw-bold mt-1" th:text="${rp.name}"></h6>
                        <div class="d-flex justify-content-between align-items-center mt-2">
                            <span class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(rp.price,1,'COMMA',2,'POINT')}"></span>
                            <a th:href="@{/products/{id}(id=${rp.id})}" class="btn btn-outline-dark btn-sm">View</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function adjustQty(delta) {
    const input = document.getElementById('qty');
    const newVal = parseInt(input.value) + delta;
    if (newVal >= 1 && newVal <= parseInt(input.max)) input.value = newVal;
}
</script>
</body>
</html>
