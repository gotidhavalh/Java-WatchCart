# ─── Server ───────────────────────────────────────────────
server.port=8080

# ─── MySQL DataSource ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/watchcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Use 'validate' after running the SQL import file
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Thymeleaf ─────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─── Connection Pool ───────────────────────────────────────
spring.datasource.hikari.pool-name=WatchCartPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ─── Logging ───────────────────────────────────────────────
logging.level.com.watchcart=DEBUG
logging.level.org.springframework.security=INFO

# ─── File Upload ───────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── Application ───────────────────────────────────────────
app.name=WatchCart
app.version=1.0.0
