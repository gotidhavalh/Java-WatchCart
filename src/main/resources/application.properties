# ─── Server ───────────────────────────────────────────────
server.port=8080

# ─── MySQL DataSource ──────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/watchcart_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ───────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Use 'validate' after running the SQL import file
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── Connection Pool ───────────────────────────────────────
spring.datasource.hikari.pool-name=WatchCartPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000

# ─── Logging ───────────────────────────────────────────────
logging.level.com.watchcart=DEBUG
logging.level.org.springframework.security=INFO
# Single log file for all application logs (console output is kept as well)
logging.file.name=logs/watchcart.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n

# ─── File Upload ───────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── Application ───────────────────────────────────────────
app.name=WatchCart
app.version=1.0.0
