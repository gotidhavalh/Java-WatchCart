<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/layout :: head('Watches')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">
    <div class="row g-4">

        <!-- Sidebar -->
        <div class="col-lg-3">
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold text-uppercase mb-3">Categories</h6>
                    <ul class="list-unstyled mb-0">
                        <li class="mb-1">
                            <a th:href="@{/products}" class="text-decoration-none text-dark d-flex align-items-center py-1 px-2 rounded hover-bg">
                                <i class="bi bi-grid me-2 text-warning"></i> All Watches
                            </a>
                        </li>
                        <li class="mb-1" th:each="cat : ${categories}">
                            <a th:href="@{/products(category=${cat.id})}"
                               th:classappend="${selectedCategory == cat.id} ? 'fw-bold bg-warning bg-opacity-25'"
                               class="text-decoration-none text-dark d-flex align-items-center py-1 px-2 rounded">
                                <i class="bi bi-tag me-2 text-warning"></i>
                                <span th:text="${cat.name}">Category</span>
                            </a>
                        </li>
                    </ul>
                    <hr/>
                    <h6 class="fw-bold text-uppercase mb-3">Sort By</h6>
                    <form th:action="@{/products}" method="get">
                        <input type="hidden" name="search" th:value="${search}"/>
                        <select name="sort" class="form-select form-select-sm" onchange="this.form.submit()">
                            <option value="name" th:selected="${sort == 'name'}">Name A–Z</option>
                            <option value="price" th:selected="${sort == 'price'}">Price Low–High</option>
                            <option value="brand" th:selected="${sort == 'brand'}">Brand</option>
                            <option value="createdAt" th:selected="${sort == 'createdAt'}">Newest</option>
                        </select>
                    </form>
                </div>
            </div>
        </div>

        <!-- Product Grid -->
        <div class="col-lg-9">
            <!-- Search heading -->
            <div th:if="${search}" class="mb-3">
                <h5>Search results for: <strong th:text="${search}"></strong></h5>
            </div>

            <div th:if="${products.isEmpty()}" class="text-center py-5">
                <i class="bi bi-search fs-1 text-muted"></i>
                <p class="mt-3 text-muted">No watches found.</p>
                <a th:href="@{/products}" class="btn btn-dark">Browse All</a>
            </div>

            <div class="row g-4" th:unless="${products.isEmpty()}">
                <div class="col-sm-6 col-xl-4" th:each="product : ${products}">
                    <div class="card border-0 shadow-sm h-100 product-card">
                        <div class="overflow-hidden" style="height:200px; background:#f8f9fa;">
                            <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/400x300?text=Watch'}"
                                 class="card-img-top h-100 w-100 object-fit-cover"
                                 th:alt="${product.name}"/>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <small class="text-muted text-uppercase fw-semibold" th:text="${product.brand}"></small>
                            <h6 class="fw-bold mt-1" th:text="${product.name}">Watch Name</h6>
                            <p class="text-muted small mb-2 flex-grow-1" th:text="${#strings.abbreviate(product.description, 80)}"></p>
                            <div class="d-flex justify-content-between align-items-center mt-auto">
                                <span class="fw-bold fs-5" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,'COMMA',2,'POINT')}"></span>
                                <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-dark btn-sm">View Details</a>
                            </div>
                        </div>
                        <div class="card-footer bg-transparent border-0 pt-0 pb-3 px-3">
                            <small class="text-muted">
                                <i class="bi bi-box-seam me-1"></i>
                                <span th:text="${product.stockQuantity > 0 ? 'In Stock (' + product.stockQuantity + ')' : 'Out of Stock'}"></span>
                            </small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pagination -->
            <nav class="mt-4" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${currentPage - 1}, sort=${sort}, search=${search})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/products(page=${i}, sort=${sort}, search=${search})}" th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/products(page=${currentPage + 1}, sort=${sort}, search=${search})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
