<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('My Profile')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">

            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div class="bg-dark text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                             style="width:80px; height:80px; font-size:2rem;">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h4 class="fw-bold mb-0" th:text="${user.fullName}">Name</h4>
                        <small class="text-muted" th:text="${user.email}"></small>
                        <br/>
                        <span class="badge bg-warning text-dark mt-1" th:text="${user.role}"></span>
                    </div>

                    <form th:action="@{/profile/update}" th:object="${user}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email <span class="text-muted">(read-only)</span></label>
                            <input type="email" class="form-control bg-light" th:value="${user.email}" readonly/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Phone Number</label>
                            <input type="tel" class="form-control" th:field="*{phoneNumber}" placeholder="+91 98765 43210"/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Address</label>
                            <textarea class="form-control" th:field="*{address}" rows="3"
                                      placeholder="Your full shipping address"></textarea>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark flex-grow-1 py-2 fw-semibold">
                                <i class="bi bi-save me-2"></i>Save Changes
                            </button>
                            <a th:href="@{/orders}" class="btn btn-outline-dark py-2 px-4">
                                <i class="bi bi-bag me-1"></i>Orders
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
