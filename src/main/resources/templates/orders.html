<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('My Orders')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-bag me-2"></i>My Orders</h2>

    <div th:if="${orders.isEmpty()}" class="text-center py-5">
        <i class="bi bi-bag-x display-1 text-muted"></i>
        <h4 class="mt-3 text-muted">No orders yet</h4>
        <a th:href="@{/products}" class="btn btn-dark mt-3 px-5">Start Shopping</a>
    </div>

    <div class="card border-0 shadow-sm" th:unless="${orders.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Order #</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td class="fw-semibold" th:text="${order.orderNumber}"></td>
                        <td th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy')}"></td>
                        <td th:text="${order.items.size()} + ' item(s)'"></td>
                        <td class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' :
                                                  (${order.status.name() == 'CANCELLED'} ? 'bg-danger' :
                                                  (${order.status.name() == 'SHIPPED'} ? 'bg-info' : 'bg-warning text-dark'))"
                                  th:text="${order.status}"></span>
                        </td>
                        <td>
                            <a th:href="@{/orders/{id}(id=${order.id})}" class="btn btn-outline-dark btn-sm">Details</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
