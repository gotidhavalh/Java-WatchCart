<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="fragments/layout :: head('Home')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<!-- Hero Banner -->
<section class="hero-section text-white d-flex align-items-center"
         style="background: linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); min-height:520px;">
    <div class="container text-center py-5">
        <span class="badge bg-warning text-dark mb-3 fs-6 px-3 py-2">New Collection 2024</span>
        <h1 class="display-3 fw-bold mb-3">Time Crafted <br/>to Perfection</h1>
        <p class="lead mb-4 text-light opacity-75">Explore our curated collection of luxury timepieces from the world's finest brands.</p>
        <a th:href="@{/products}" class="btn btn-warning btn-lg px-5 me-3 fw-semibold">
            <i class="bi bi-watch me-2"></i>Shop Now
        </a>
        <a th:href="@{/register}" sec:authorize="isAnonymous()" class="btn btn-outline-light btn-lg px-5">
            Join Us Free
        </a>
    </div>
</section>

<!-- Flash Messages -->
<div class="container mt-3" th:if="${successMessage}">
    <div class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- Categories -->
<section class="py-5">
    <div class="container">
        <h2 class="fw-bold text-center mb-4">Shop by Category</h2>
        <div class="row g-3 justify-content-center">
            <div class="col-6 col-md-3 col-lg-2" th:each="cat : ${categories}">
                <a th:href="@{/products(category=${cat.id})}" class="text-decoration-none">
                    <div class="card text-center border-0 shadow-sm h-100 category-card">
                        <div class="card-body py-4">
                            <i class="bi bi-watch fs-1 text-warning d-block mb-2"></i>
                            <span class="fw-semibold" th:text="${cat.name}">Category</span>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </div>
</section>

<!-- New Arrivals -->
<section class="py-5 bg-white">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold mb-0">New Arrivals</h2>
            <a th:href="@{/products}" class="btn btn-outline-dark btn-sm">View All <i class="bi bi-arrow-right"></i></a>
        </div>
        <div class="row g-4">
            <div class="col-sm-6 col-md-4 col-lg-3" th:each="product : ${newArrivals}">
                <div class="card border-0 shadow-sm h-100 product-card">
                    <div class="position-relative overflow-hidden" style="height:220px; background:#f8f9fa;">
                        <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/400x300?text=Watch'}"
                             class="card-img-top h-100 w-100 object-fit-cover"
                             th:alt="${product.name}"/>
                        <span class="badge bg-warning text-dark position-absolute top-0 end-0 m-2">New</span>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <small class="text-muted text-uppercase fw-semibold" th:text="${product.brand}"></small>
                        <h6 class="card-title mt-1 mb-2 fw-bold" th:text="${product.name}">Watch Name</h6>
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <span class="fs-5 fw-bold text-dark" th:text="'₹' + ${#numbers.formatDecimal(product.price,1,'COMMA',2,'POINT')}">₹0</span>
                            <a th:href="@{/products/{id}(id=${product.id})}" class="btn btn-dark btn-sm">View</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Features Strip -->
<section class="py-4 bg-warning">
    <div class="container">
        <div class="row text-center g-3">
            <div class="col-6 col-md-3">
                <i class="bi bi-truck fs-2 d-block mb-1"></i>
                <span class="fw-semibold small">Free Shipping over ₹5000</span>
            </div>
            <div class="col-6 col-md-3">
                <i class="bi bi-shield-check fs-2 d-block mb-1"></i>
                <span class="fw-semibold small">2 Year Warranty</span>
            </div>
            <div class="col-6 col-md-3">
                <i class="bi bi-arrow-return-left fs-2 d-block mb-1"></i>
                <span class="fw-semibold small">30-Day Returns</span>
            </div>
            <div class="col-6 col-md-3">
                <i class="bi bi-headset fs-2 d-block mb-1"></i>
                <span class="fw-semibold small">24/7 Support</span>
            </div>
        </div>
    </div>
</section>

<footer th:replace="fragments/layout :: footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
