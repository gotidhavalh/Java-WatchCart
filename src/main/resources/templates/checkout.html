<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Checkout')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">
    <h2 class="fw-bold mb-4"><i class="bi bi-bag-check me-2"></i>Checkout</h2>

    <div th:if="${errorMessage}" class="alert alert-danger">
        <i class="bi bi-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
    </div>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-4">Shipping &amp; Payment</h5>
                    <form th:action="@{/orders/place}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" class="form-control" th:value="${user.fullName}" readonly/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" th:value="${user.email}" readonly/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Shipping Address *</label>
                            <textarea name="shippingAddress" class="form-control" rows="3"
                                      required th:text="${user.address}"
                                      placeholder="House/Flat No, Street, City, State, PIN"></textarea>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Payment Method *</label>
                            <select name="paymentMethod" class="form-select" required>
                                <option value="">— Select payment —</option>
                                <option value="CREDIT_CARD">Credit / Debit Card</option>
                                <option value="UPI">UPI</option>
                                <option value="NET_BANKING">Net Banking</option>
                                <option value="COD">Cash on Delivery</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold fs-5">
                            <i class="bi bi-check-circle me-2"></i>Place Order
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="fw-bold mb-3">Delivery Info</h5>
                    <ul class="list-unstyled text-muted small">
                        <li class="mb-2"><i class="bi bi-truck me-2 text-success"></i>Free shipping on orders above ₹5,000</li>
                        <li class="mb-2"><i class="bi bi-clock me-2 text-info"></i>Standard delivery: 5–7 business days</li>
                        <li class="mb-2"><i class="bi bi-shield-check me-2 text-warning"></i>All orders insured &amp; tracked</li>
                        <li><i class="bi bi-arrow-return-left me-2 text-danger"></i>Free returns within 30 days</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
