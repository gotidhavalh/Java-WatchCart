<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/layout :: head('Order Details')"></head>
<body class="bg-light">

<nav th:replace="fragments/layout :: navbar"></nav>

<div class="container py-5">

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <i class="bi bi-check-circle me-2"></i><span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Order <span th:text="${order.orderNumber}"></span></h5>
                    <span class="badge fs-6"
                          th:classappend="${order.status.name() == 'DELIVERED'} ? 'bg-success' :
                                          (${order.status.name() == 'CANCELLED'} ? 'bg-danger' :
                                          (${order.status.name() == 'SHIPPED'} ? 'bg-info' : 'bg-warning text-dark'))"
                          th:text="${order.status}"></span>
                </div>
                <div class="card-body p-0">
                    <div th:each="item : ${order.items}" class="p-4 border-bottom d-flex gap-3 align-items-center">
                        <img th:src="${item.product.imageUrl != null ? item.product.imageUrl : 'https://placehold.co/80x80?text=Watch'}"
                             style="height:70px; width:70px; object-fit:cover; border-radius:8px;"
                             th:alt="${item.product.name}"/>
                        <div class="flex-grow-1">
                            <small class="text-muted text-uppercase" th:text="${item.product.brand}"></small>
                            <h6 class="fw-bold mb-0" th:text="${item.product.name}"></h6>
                            <small class="text-muted">Qty: <span th:text="${item.quantity}"></span></small>
                        </div>
                        <div class="text-end">
                            <div class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(item.subtotal,1,'COMMA',2,'POINT')}"></div>
                            <small class="text-muted" th:text="'@ ₹' + ${#numbers.formatDecimal(item.unitPrice,1,'COMMA',2,'POINT')}"></small>
                        </div>
                    </div>
                    <div class="p-4 d-flex justify-content-between align-items-center">
                        <span class="fw-bold fs-5">Order Total</span>
                        <span class="fw-bold fs-5"
                              th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount,1,'COMMA',2,'POINT')}"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <h6 class="fw-bold mb-3">Shipping Address</h6>
                    <p class="text-muted mb-0" th:text="${order.shippingAddress}"></p>
                </div>
            </div>
            <div class="card border-0 shadow-sm mb-3">
                <div class="card-body">
                    <h6 class="fw-bold mb-2">Payment Method</h6>
                    <p class="text-muted mb-0" th:text="${order.paymentMethod}"></p>
                </div>
            </div>
            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="fw-bold mb-2">Order Placed</h6>
                    <p class="text-muted mb-0"
                       th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></p>
                </div>
            </div>
            <a th:href="@{/orders}" class="btn btn-outline-dark w-100 mt-3">← Back to Orders</a>
        </div>
    </div>
</div>

<footer th:replace="fragments/layout :: footer"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
